name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force Deploy'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - multi-tenant

env:
  # === 核心配置：锁定稳定版 2.13.56 ===
  FIXED_BACKEND_VERSION: "2.13.56"
  FIXED_FRONTEND_VERSION: "2.13.56"
  SUBSTORE_REPO: sub-store-org/Sub-Store
  FRONTEND_REPO: sub-store-org/Sub-Store-Front-End

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    name: Deploy Backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Sub-Store Source
        env:
          # 【关键修复】必须带上 Token，否则会被 GitHub 404 拦截
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ env.FIXED_BACKEND_VERSION }}
          echo "Downloading Backend $VERSION..."
          
          # 使用 Token 下载，解决 404 问题
          curl -L -H "Authorization: token $GITHUB_TOKEN" \
            "https://github.com/${{ env.SUBSTORE_REPO }}/archive/refs/tags/${VERSION}.tar.gz" -o substore.tar.gz
          
          # 检查文件是否真的是压缩包
          FILESIZE=$(stat -c%s "substore.tar.gz")
          echo "文件大小: $FILESIZE 字节"
          
          if [ "$FILESIZE" -lt 1000 ]; then
            echo "::error::下载失败！内容如下："
            cat substore.tar.gz
            exit 1
          fi

          mkdir -p temp_backend
          tar -xzf substore.tar.gz -C temp_backend --strip-components=1
          
          mkdir -p build/sub-store
          cp -r temp_backend/backend build/sub-store/
          rsync -av --exclude='.git' --exclude='build' --exclude='node_modules' --exclude='temp_backend' --exclude='substore.tar.gz' . build/

      - name: Configure wrangler.toml
        run: |
          cd build
          cp wrangler.toml.example wrangler.toml
          JWT_SECRET='${{ secrets.JWT_SECRET }}'
          ESCAPED_JWT_SECRET=$(printf '%s' "$JWT_SECRET" | sed -e 's/[\\/&]/\\\\&/g')
          sed -i "s|__JWT_SECRET__|$ESCAPED_JWT_SECRET|g" wrangler.toml

      # 安装 pnpm (解决依赖安装报错)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          echo "Installing Backend with pnpm..."
          # 使用 pnpm 安装后端依赖
          cd build/sub-store/backend && pnpm install
          
          echo "Installing Adapter with Bun..."
          cd ../.. && bun install

      - name: Build Backend
        working-directory: build
        run: bun run build

      - name: Deploy Backend to Workers
        working-directory: build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun x wrangler deploy

  deploy-frontend:
    runs-on: ubuntu-latest
    name: Deploy Frontend
    steps:
      - name: Download Frontend Dist
        env:
          # 【关键修复】前端下载也加上 Token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ env.FIXED_FRONTEND_VERSION }}
          echo "Downloading Frontend $VERSION..."
          
          curl -L -H "Authorization: token $GITHUB_TOKEN" \
            "https://github.com/${{ env.FRONTEND_REPO }}/releases/download/${VERSION}/dist.zip" -o dist.zip
          
          # 检查下载结果
          if [ $(stat -c%s dist.zip) -lt 1000 ]; then
             echo "::error::前端下载失败，内容："
             cat dist.zip
             exit 1
          fi
          
          mkdir -p frontend-temp
          unzip -o dist.zip -d frontend-temp
          
          REAL_PATH=$(find frontend-temp -name "index.html" -exec dirname {} + | head -n 1)
          echo "REAL_PATH=$REAL_PATH" >> $GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy Frontend to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying from: ${{ env.REAL_PATH }}"
          bun x wrangler pages deploy "${{ env.REAL_PATH }}" --project-name=sub-store-frontend --branch=main --commit-dirty=true
